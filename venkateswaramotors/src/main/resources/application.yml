spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  autoconfigure:
    exclude: ${REDIS_AUTOCONFIGURE_EXCLUDE}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: ${SPRING_DATA_MONGODB_DATABASE}
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}
      password: ${SPRING_DATA_REDIS_PASSWORD}

# Email API Configuration
email:
  api:
    url: ${EMAIL_API_URL}
    endpoint: ${EMAIL_API_ENDPOINT}

# Server Configuration
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

# Logging Configuration
logging:
  level:
    com.monesh.venkateswaramotors: ${LOGGING_LEVEL_COM_MONESH_VENKATESWARAMOTORS}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY}